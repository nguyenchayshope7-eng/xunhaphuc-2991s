<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản lý SĐT Online - Auto Filter</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 20px;

    margin: 0;

    transition:
        background .5s,
        color .5s;
}

body.duplicate-mode {
    background: #8b0000 !important;
    color: black !important;
}

h3 {
    margin-top: 5px;
    margin-bottom: 15px;
}

textarea,
input,
button {

    font-size: 16px;

    width: 90%;
    max-width: 340px;

    margin-top: 10px;

    padding: 12px;

    border-radius: 6px;

    border: 1px solid #ccc;

    box-sizing: border-box;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

button {

    background: #007bff;

    color: white;

    border: none;

    cursor: pointer;

    transition: opacity .2s;
}

button:hover {
    opacity: .9;
}

#deleteListButton {
    background: #0f4d0a;
}

#copyButton {

    font-size: 20px;

    padding: 18px;

    width: 95%;

    max-width: 380px;

    background: #a728a7;
}

#clearLogsButton {
    background: #ffc107;
    color: black;
}

#manualCopyButton {
    background: #007bff;
}

#customToast {

    position: fixed;

    top: -100px;

    left: 0;

    width: 100%;

    background-color: #343a40;

    color: white;

    text-align: center;

    padding: 16px 10px;

    font-size: 18px;

    font-weight: bold;

    box-shadow:
        0 4px 12px rgba(0,0,0,.3);

    z-index: 9999;

    transition:
        top .5s ease-in-out;
}

#customToast.show {
    top: 0;
}

#customToast.error {
    background-color: #d93025;
}

#customToast.success {
    background-color: #28a745;
}

#deviceInfo {

    font-size: 12px;

    color: #777;

    margin-top: 15px;

    word-break: break-all;

    max-width: 90%;
}

</style>

</head>


<body>


<!-- =========================
     TOAST
========================= -->

<div id="customToast"></div>


<!-- =========================
     TITLE
========================= -->

<h3>
    📱 Quản lý danh sách Số Điện Thoại Online
</h3>


<!-- =========================
     INPUT
========================= -->

<textarea
    id="phoneListInput"
    placeholder="Dán SĐT, text rác, phân cách bất kỳ">
</textarea>


<button id="addListButton">
    ➕ Thêm SĐT
</button>


<button id="deleteListButton">
    🗑️ Xóa Danh Sách SĐT
</button>


<!-- =========================
     OUTPUT
========================= -->

<input
    type="text"
    id="phoneOutput"
    readonly
    placeholder="SĐT sau khi bỏ 2 số đầu"
>


<button id="manualCopyButton">
    📋 Copy
</button>


<!-- =========================
     COUNT
========================= -->

<p id="count">
    📊 Số điện thoại còn lại: 0
</p>


<!-- =========================
     LOG
========================= -->

<button id="clearLogsButton">
    🧹 Clear Log Copy
</button>


<!-- =========================
     MAIN COPY
========================= -->

<button id="copyButton">
    📋 Lấy & Copy Số Điện Thoại
</button>


<div id="deviceInfo"></div>


<script>


/* =========================================================
   FIREBASE
========================================================= */

firebase.initializeApp({

    apiKey:
        "AIzaSyBArMthV7bSzHB8Xy48AT6jo4z1Xek51Nw",

    authDomain:
        "nhatxupro-c91a2.firebaseapp.com",

    databaseURL:
        "https://nhatxupro-c91a2-default-rtdb.asia-southeast1.firebasedatabase.app"

});


const db = firebase.database();


/*
    Node chứa danh sách SĐT
*/
const phoneRef =
    db.ref("phones");


/*
    Node chứa log copy
*/
const copyLogsRef =
    db.ref("phoneCopyLogs");


/* =========================================================
   VARIABLES
========================================================= */

let phoneList = [];

let isDuplicateToast = false;


/* =========================================================
   DEVICE ID
========================================================= */

let deviceId =
    localStorage.getItem("deviceId");


if (!deviceId) {

    deviceId =
        "dev_" +
        Math.random()
            .toString(36)
            .substring(2, 10);

    localStorage.setItem(
        "deviceId",
        deviceId
    );
}


document.getElementById(
    "deviceInfo"
).textContent =
    "Thiết bị: " + deviceId;


/* =========================================================
   EXTRACT PHONE
========================================================= */

/*
    Nhận số điện thoại quốc tế.

    Ví dụ:

    447462161407
    +447462161407
    44 7462 161407
    44-7462-161407

    Sau khi lấy chỉ giữ phần số.

    Không bắt buộc mã quốc gia nào.
*/

function extractPhones(text) {

    const results = [];


    /*
        Tìm các chuỗi có số.

        Cho phép:
        khoảng trắng
        dấu -
        dấu .
        dấu (
        dấu )
        dấu +
    */

    const matches =
        text.match(
            /\+?\d(?:[\d\s().-]*\d)?/g
        ) || [];


    matches.forEach(raw => {


        /*
            Chỉ giữ lại chữ số
        */

        let phone =
            raw.replace(/\D/g, "");


        /*
            Số phải có từ 8 đến 15 chữ số
        */

        if (
            phone.length >= 8 &&
            phone.length <= 15
        ) {

            results.push(phone);

        }

    });


    /*
        Bỏ số trùng
    */

    return [
        ...new Set(results)
    ];
}


/* =========================================================
   REMOVE FIRST 2 DIGITS
========================================================= */

/*
    Ví dụ:

    447462161407
    ↓
    7462161407
*/

function removeFirstTwoDigits(phone) {

    phone =
        String(phone);


    if (
        phone.length <= 2
    ) {

        return "";

    }


    return phone.substring(2);
}


/* =========================================================
   UPDATE COUNT
========================================================= */

function updateCount() {

    document.getElementById(
        "count"
    ).textContent =
        `📊 Số điện thoại còn lại: ${phoneList.length}`;
}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    msg,
    type = ""
) {

    const toast =
        document.getElementById(
            "customToast"
        );


    toast.textContent =
        msg;


    toast.className =
        "show " + type;


    if (
        type !== "error"
    ) {

        setTimeout(() => {

            if (
                !isDuplicateToast
            ) {

                toast.className =
                    "";

            }

        }, 4000);

    }

}


/* =========================================================
   DUPLICATE TOAST
========================================================= */

function showDuplicateToast(
    msg
) {

    isDuplicateToast =
        true;


    document.body.classList.add(
        "duplicate-mode"
    );


    showToast(
        msg,
        "error"
    );

}


function hideDuplicateToast() {

    isDuplicateToast =
        false;


    document.body.classList.remove(
        "duplicate-mode"
    );


    document.getElementById(
        "customToast"
    ).className =
        "";

}


/* =========================================================
   COPY
========================================================= */

function copyText(text) {

    if (!text) {

        showToast(
            "⚠️ Không có SĐT để copy",
            "error"
        );

        return;

    }


    /*
        Clipboard API
    */

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(text)

            .then(() => {

                showToast(
                    `✅ Đã copy: ${text}`,
                    "success"
                );

            })

            .catch(() => {

                fallbackCopy(text);

            });

    } else {

        fallbackCopy(text);

    }

}


/* =========================================================
   FALLBACK COPY
========================================================= */

function fallbackCopy(text) {

    const temp =
        document.createElement(
            "textarea"
        );


    temp.value =
        text;


    temp.style.position =
        "fixed";

    temp.style.left =
        "-9999px";


    document.body.appendChild(
        temp
    );


    temp.focus();

    temp.select();


    try {

        document.execCommand(
            "copy"
        );


        showToast(
            `✅ Đã copy: ${text}`,
            "success"
        );

    }

    catch (error) {

        showToast(
            "⚠️ Không thể copy",
            "error"
        );

    }


    document.body.removeChild(
        temp
    );

}


/* =========================================================
   FIREBASE LISTENER
========================================================= */

phoneRef.on(
    "value",
    snap => {

        const data =
            snap.val();


        phoneList =
            data
                ? Object.values(data)
                : [];


        updateCount();

    },

    error => {

        console.error(
            "Firebase error:",
            error
        );


        showToast(
            "⚠️ Không thể đọc Firebase",
            "error"
        );

    }
);


/* =========================================================
   ADD PHONE
========================================================= */

document.getElementById(
    "addListButton"
).onclick = () => {


    const input =
        document.getElementById(
            "phoneListInput"
        );


    const text =
        input.value;


    if (!text.trim()) {

        showToast(
            "⚠️ Hãy nhập SĐT",
            "error"
        );

        return;

    }


    /*
        Lọc SĐT
    */

    const phones =
        extractPhones(
            text
        );


    console.log(
        "SĐT tìm được:",
        phones
    );


    if (!phones.length) {

        showToast(
            "⚠️ Không có SĐT hợp lệ",
            "error"
        );

        return;

    }


    /*
        Thêm vào Firebase
    */

    let added =
        0;


    phones.forEach(
        phone => {

            phoneRef
                .push(phone);

            added++;

        }
    );


    /*
        Xóa ô nhập
    */

    input.value =
        "";


    showToast(
        `✅ Đã thêm ${added} SĐT`,
        "success"
    );

};


/* =========================================================
   DELETE ALL PHONES
========================================================= */

document.getElementById(
    "deleteListButton"
).onclick = () => {


    if (
        !confirm(
            "Xóa toàn bộ danh sách SĐT?"
        )
    ) {

        return;

    }


    phoneRef
        .remove()
        .then(() => {

            showToast(
                "✅ Đã xóa toàn bộ danh sách",
                "success"
            );

        })
        .catch(() => {

            showToast(
                "⚠️ Không thể xóa danh sách",
                "error"
            );

        });

};


/* =========================================================
   MANUAL COPY
========================================================= */

document.getElementById(
    "manualCopyButton"
).onclick = () => {


    const output =
        document.getElementById(
            "phoneOutput"
        );


    if (
        !output.value
    ) {

        showToast(
            "⚠️ Chưa có SĐT",
            "error"
        );

        return;

    }


    copyText(
        output.value
    );

};


/* =========================================================
   GET + COPY PHONE
========================================================= */

document.getElementById(
    "copyButton"
).onclick = async () => {


    hideDuplicateToast();


    /*
        Kiểm tra danh sách
    */

    if (
        !phoneList.length
    ) {

        showToast(
            "⚠️ Danh sách đã hết SĐT",
            "error"
        );

        return;

    }


    /*
        Chọn ngẫu nhiên
    */

    const randomIndex =
        Math.floor(
            Math.random() *
            phoneList.length
        );


    const originalPhone =
        phoneList[randomIndex];


    /*
        Bỏ 2 số đầu
    */

    const phone =
        removeFirstTwoDigits(
            originalPhone
        );


    if (
        !phone ||
        phone.length < 6
    ) {

        showToast(
            "⚠️ SĐT không hợp lệ",
            "error"
        );

        return;

    }


    /*
        Hiển thị kết quả
    */

    document.getElementById(
        "phoneOutput"
    ).value =
        phone;


    /*
        Copy
    */

    copyText(
        phone
    );


    /* =====================================================
       GHI LOG
    ===================================================== */

    const now =
        Date.now();


    const logKey =
        now + "_" + deviceId;


    await copyLogsRef
        .child(logKey)
        .set({

            originalPhone:
                originalPhone,

            phone:
                phone,

            time:
                now,

            deviceId:
                deviceId

        });


    /* =====================================================
       KIỂM TRA TRÙNG
    ===================================================== */

    copyLogsRef
        .orderByChild("time")
        .startAt(
            now - 15000
        )
        .once(
            "value",
            snap => {


                const logs =
                    snap.val() || {};


                for (
                    const key in logs
                ) {


                    const log =
                        logs[key];


                    /*
                        Không tính chính mình
                    */

                    if (
                        log.deviceId ===
                        deviceId
                    ) {

                        continue;

                    }


                    /*
                        Nếu cùng số sau xử lý
                    */

                    if (
                        log.phone ===
                        phone
                    ) {

                        showDuplicateToast(
                            `⚠️ SĐT "${phone}" đã bị lấy bởi thiết bị khác!`
                        );


                        break;

                    }

                }

            }
        );


    /* =====================================================
       XÓA SỐ GỐC KHỎI FIREBASE
    ===================================================== */

    phoneRef
        .orderByValue()
        .equalTo(
            originalPhone
        )
        .limitToFirst(1)
        .once(
            "value",
            snap => {

                snap.forEach(
                    child => {

                        child.ref.remove();

                    }
                );

            }
        );

};


/* =========================================================
   CLEAR LOG
========================================================= */

document.getElementById(
    "clearLogsButton"
).onclick = () => {


    if (
        !confirm(
            "Clear toàn bộ log copy?"
        )
    ) {

        return;

    }


    copyLogsRef
        .remove()
        .then(() => {

            showToast(
                "✅ Đã clear log",
                "success"
            );

        })
        .catch(() => {

            showToast(
                "⚠️ Không thể clear log",
                "error"
            );

        });

};


</script>

</body>
</html>

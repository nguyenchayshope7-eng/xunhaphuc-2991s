<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quản lý SĐT Online - Auto Filter</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
body {
  font-family: sans-serif;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  transition: background .5s, color .5s;
  color: initial;
}

body.duplicate-mode {
  background: #8b0000 !important;
  color: black !important;
}

textarea,
input,
button {
  font-size: 16px;
  width: 90%;
  max-width: 340px;
  margin-top: 10px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background: #007bff;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

#deleteListButton {
  background: #0f4d0a;
}

#copyButton {
  font-size: 20px;
  padding: 18px;
  width: 95%;
  max-width: 380px;
  background: #a728a7;
}

#clearLogsButton {
  background: #ffc107;
  color: black;
}

#customToast {
  position: fixed;
  top: -100px;
  left: 0;
  width: 100%;
  background-color: #343a40;
  color: white;
  text-align: center;
  padding: 16px 10px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  z-index: 9999;
  transition: top .5s ease-in-out;
}

#customToast.show {
  top: 0;
}

#customToast.error {
  background-color: #d93025;
}

#customToast.success {
  background-color: #28a745;
}
</style>
</head>

<body>

<div id="customToast"></div>

<h3>📱 Quản lý danh sách Số Điện Thoại Online</h3>

<textarea
  id="phoneListInput"
  placeholder="Dán danh sách SĐT, text rác, phân cách bất kỳ"
></textarea>

<button id="addListButton">
  ➕ Thêm SĐT
</button>

<button id="deleteListButton">
  🗑️ Xóa Danh Sách SĐT
</button>

<input
  type="text"
  id="phoneOutput"
  readonly
  placeholder="SĐT sau khi bỏ 2 số đầu sẽ xuất hiện ở đây"
>

<button id="manualCopyButton">
  📋 Copy
</button>

<p id="count">
  📊 Số SĐT còn lại: 0
</p>

<button id="clearLogsButton">
  🧹 Clear Log Copy
</button>

<button id="copyButton">
  📋 Lấy & Copy SĐT
</button>


<script>

/* =========================================================
   FIREBASE
========================================================= */

firebase.initializeApp({
  apiKey: "AIzaSyBArMthV7bSzHB8Xy48AT6jo4z1Xek51Nw",
  authDomain: "nhatxupro-c91a2.firebaseapp.com",
  databaseURL:
    "https://nhatxupro-c91a2-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db = firebase.database();

/*
   Dùng node riêng "phones"
   để không ảnh hưởng danh sách email cũ.
*/
const phoneRef = db.ref("phones");

/*
   Log dùng riêng cho SĐT
*/
const copyLogsRef = db.ref("phoneCopyLogs");


let phoneList = [];
let isDuplicateToast = false;


/* =========================================================
   DEVICE ID
========================================================= */

let deviceId = localStorage.getItem("deviceId");

if (!deviceId) {

  deviceId =
    "dev_" +
    Math.random()
      .toString(36)
      .substring(2, 10);

  localStorage.setItem(
    "deviceId",
    deviceId
  );
}


/* =========================================================
   LẤY SỐ ĐIỆN THOẠI
========================================================= */

/*
   Nhận các chuỗi số từ 8 - 15 số.

   Ví dụ:
   447462161407
   84912345678
   34612345678
   12025550123
*/

function extractPhones(text) {

  const matches =
    text.match(/\d{8,15}/g) || [];

  return [
    ...new Set(matches)
  ];
}


/* =========================================================
   BỎ 2 SỐ ĐẦU
========================================================= */

/*
   Ví dụ:

   447462161407
   ↓ bỏ 44
   7462161407

   84912345678
   ↓ bỏ 84
   912345678

   34612345678
   ↓ bỏ 34
   612345678
*/

function removeFirstTwoDigits(phone) {

  phone = String(phone);

  if (phone.length <= 2) {
    return "";
  }

  return phone.substring(2);
}


/* =========================================================
   UPDATE COUNT
========================================================= */

function updateCount() {

  document.getElementById("count").textContent =
    `📊 Số SĐT còn lại: ${phoneList.length}`;
}


/* =========================================================
   TOAST
========================================================= */

function showToast(msg, type = "") {

  const t =
    document.getElementById("customToast");

  t.textContent = msg;

  t.className =
    "show " + type;

  if (type !== "error") {

    setTimeout(() => {

      if (!isDuplicateToast) {
        t.className = "";
      }

    }, 4000);
  }
}


function showDuplicateToast(msg) {

  isDuplicateToast = true;

  document.body.classList.add(
    "duplicate-mode"
  );

  showToast(
    msg,
    "error"
  );
}


function hideDuplicateToast() {

  isDuplicateToast = false;

  document.body.classList.remove(
    "duplicate-mode"
  );

  document.getElementById(
    "customToast"
  ).className = "";
}


/* =========================================================
   COPY
========================================================= */

function copyText(text) {

  if (!text) {

    showToast(
      "⚠️ Không có dữ liệu để copy",
      "error"
    );

    return;
  }

  navigator.clipboard
    .writeText(text)

    .then(() => {

      showToast(
        `✅ Đã copy: ${text}`,
        "success"
      );

    })

    .catch(() => {

      showToast(
        "⚠️ Không thể copy",
        "error"
      );

    });
}


/* =========================================================
   FIREBASE LISTENER
========================================================= */

phoneRef.on("value", snap => {

  const data = snap.val();

  phoneList =
    data
      ? Object.values(data)
      : [];

  updateCount();
});


/* =========================================================
   THÊM SĐT
========================================================= */

document
  .getElementById("addListButton")
  .onclick = () => {

    const input =
      document.getElementById(
        "phoneListInput"
      );

    const phones =
      extractPhones(
        input.value
      );

    if (!phones.length) {

      showToast(
        "⚠️ Không có SĐT hợp lệ",
        "error"
      );

      return;
    }

    /*
       Thêm từng SĐT vào Firebase
    */

    phones.forEach(phone => {

      phoneRef.push(phone);

    });

    input.value = "";

    showToast(
      `✅ Đã thêm ${phones.length} SĐT`,
      "success"
    );
  };


/* =========================================================
   XÓA DANH SÁCH
========================================================= */

document
  .getElementById("deleteListButton")
  .onclick = () => {

    if (
      !confirm(
        "Xóa toàn bộ danh sách SĐT?"
      )
    ) {
      return;
    }

    phoneRef.remove();

    showToast(
      "✅ Đã xóa danh sách SĐT",
      "success"
    );
  };


/* =========================================================
   COPY THỦ CÔNG
========================================================= */

document
  .getElementById("manualCopyButton")
  .onclick = () => {

    const output =
      document.getElementById(
        "phoneOutput"
      );

    if (!output.value) {

      showToast(
        "⚠️ Chưa có SĐT",
        "error"
      );

      return;
    }

    copyText(
      output.value
    );
  };


/* =========================================================
   LẤY + COPY SĐT
========================================================= */

document
  .getElementById("copyButton")
  .onclick = () => {

    hideDuplicateToast();

    /*
       Kiểm tra danh sách
    */

    if (!phoneList.length) {

      showToast(
        "⚠️ Danh sách đã hết SĐT",
        "error"
      );

      return;
    }


    /*
       Chọn ngẫu nhiên một SĐT
    */

    const originalPhone =
      phoneList[
        Math.floor(
          Math.random() *
          phoneList.length
        )
      ];


    /*
       BỎ 2 SỐ ĐẦU

       447462161407
       ↓
       7462161407
    */

    const phone =
      removeFirstTwoDigits(
        originalPhone
      );


    if (!phone) {

      showToast(
        "⚠️ SĐT không hợp lệ",
        "error"
      );

      return;
    }


    /*
       Hiển thị SĐT sau khi bỏ 2 số đầu
    */

    document.getElementById(
      "phoneOutput"
    ).value = phone;


    /*
       Copy
    */

    copyText(phone);


    /* =====================================================
       XÓA SĐT GỐC KHỎI FIREBASE
    ===================================================== */

    phoneRef
      .orderByValue()
      .equalTo(originalPhone)
      .limitToFirst(1)
      .once("value", snap => {

        snap.forEach(child => {

          child.ref.remove();

        });

      });


    /* =====================================================
       GHI LOG
    ===================================================== */

    const now =
      Date.now();


    copyLogsRef
      .child(
        now + "_" + deviceId
      )
      .set({

        /*
           Lưu cả số gốc và số sau xử lý
        */

        originalPhone:
          originalPhone,

        phone:
          phone,

        time:
          now,

        deviceId:
          deviceId

      });


    /* =====================================================
       KIỂM TRA TRÙNG THIẾT BỊ
    ===================================================== */

    copyLogsRef
      .orderByChild("time")
      .startAt(
        now - 15000
      )
      .once("value", snap => {

        const logs =
          snap.val() || {};


        for (
          const key in logs
        ) {

          const log =
            logs[key];


          /*
             Nếu cùng SĐT đã được
             thiết bị khác lấy trong
             15 giây gần nhất
          */

          if (
            log.phone === phone &&
            log.deviceId !== deviceId
          ) {

            showDuplicateToast(
              `⚠️ SĐT "${phone}" đã bị lấy bởi thiết bị khác!`
            );

            break;
          }
        }

      });

  };


/* =========================================================
   CLEAR LOG
========================================================= */

document
  .getElementById("clearLogsButton")
  .onclick = () => {

    copyLogsRef.remove();

    showToast(
      "✅ Đã clear log",
      "success"
    );
  };


</script>

</body>
</html>
